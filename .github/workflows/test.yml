name: Test

on:
  push:
    paths:
      - '**/*.go'
      - go.mod
      - go.sum
      - .github/workflows/test.yml
  pull_request:
    paths:
      - '**/*.go'
      - go.mod
      - go.sum
      - .github/workflows/test.yml

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: faker_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d faker_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      FAKER_PG_TEST_DSN: postgres://postgres:postgres@localhost:5432/faker_test?sslmode=disable

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Vet Go code
        run: go vet ./...

      - name: Run unit and PostgreSQL integration tests
        run: go test -race ./...
